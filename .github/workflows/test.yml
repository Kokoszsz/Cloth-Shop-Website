name: Run Tests

run-name: Web Tests

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff==0.16.6

      - name: Lint
        run: ruff check .

  unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r cloth-shop/requirements.txt

      - name: Run unit tests with coverage
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  e2e:
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r cloth-shop/requirements.txt -r automation-tests/requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Start the app
        env:
          APP_ENV: development
        run: |
          python cloth-shop/Web/main.py > app.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:5000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat app.log
          exit 1

      - name: Run Playwright end-to-end tests
        run: python -m pytest automation-tests/playwright --browser chromium --tracing retain-on-failure

      - name: Show app log
        if: always()
        run: cat app.log

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
